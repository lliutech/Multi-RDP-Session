name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -trimpath -ldflags="-s -w" -o rdpmulti.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: rdpmulti-windows-amd64
          path: rdpmulti.exe
          if-no-files-found: error
